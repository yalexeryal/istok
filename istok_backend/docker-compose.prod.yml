version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: istok_db
    restart: always
    environment:
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
      POSTGRES_DB: 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - istok_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U  -d "]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: istok_api
    restart: always
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - istok_network

  nginx:
    image: nginx:alpine
    container_name: istok_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - istok_network

volumes:
  postgres_data:

networks:
  istok_network:
    driver: bridge
