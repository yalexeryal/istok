version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: istok_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"  # <--- ИЗМЕНЕНО ЗДЕСЬ (слева порт компьютера, справа порт внутри контейнера)
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: istok_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: